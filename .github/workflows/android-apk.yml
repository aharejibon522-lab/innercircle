name: Build Android APK
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "eas.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: Reinstall aligned dependencies
        run: npm install

      - name: Diagnose Expo module metadata
        working-directory: .
        run: npx expo-modules-autolinking resolve --platform android
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: innercircle-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: The Inner Circle Android build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
