services:
  - type: web
    name: innercircle-backend
    runtime: node
    region: singapore
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/innercircle.sqlite
    disk:
      name: innercircle-data
      mountPath: /var/data
      sizeGB: 1
